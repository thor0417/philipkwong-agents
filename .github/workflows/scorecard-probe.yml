# Scorecard probe. Part 2A, the mechanical layers, NINE MARKETS.
#
# ---- THE THREE RULES, AND ALL THREE HAVE BEEN BROKEN ONCE -------------------
#
#   1. A cell is only ever recorded BLOCKED from the hosted runner. Never from a
#      developer machine. The pilot recorded four BLOCKED cells from a Bangkok
#      residential IP and two were wrong: Anaheim layers 1 and 3 had been
#      published all along. The same machine has since called five different
#      markets unreadable across six runs of verify:staleness, every time HTTP 0
#      against feeds that answer 200 on the adjacent run.
#
#   2. NETWORK-BLOCKED AND APP-SHAPE-BLOCKED ARE DIFFERENT ANSWERS. A host that
#      refuses our packets is an egress problem. A host that answers 200 with a
#      JavaScript shell and no server route is an application problem, and no
#      proxy would ever have touched it.
#
#   3. EVERY URL IS SOURCED OR THE CELL IS NEEDS-NAVIGATION. A URL that is not
#      already in an adapter, or in the pilot's own recorded evidence, or a named
#      statewide register, is not evidence. A NONE on an invented URL is
#      fabrication with a status code attached.
#
# ---- WHAT THE FIRST RUN GOT WRONG, 2026-08-29 ------------------------------
#
# It ran from a clean US egress and produced four classes of bad cell. All four
# are fixed here and named so the fix is checkable:
#
#   THE MATTERS QUERY WAS BROKEN AND ANSWERED ANYWAY. `$orderby=MatterId desc`
#   carried an unencoded space. Measured: unencoded -> HTTP 000, 0 bytes;
#   encoded -> HTTP 200, 99,818 bytes, 60 matters, 46 case-numbered titles. All
#   five Legistar markets returned the identical NEEDS-NAVIGATION on layers 3, 4
#   and 7 - fifteen cells that were facts about a broken URL. Five jurisdictions
#   behaving identically is the signature of a broken probe.
#
#   THE BODY PATTERN MATCHED A PERSON. `(plan|zon)` matched Ka-PLAN and recorded
#   "Oakland L2 FIELD, Legistar body: Rebecca Kaplan" - a councilmember's name as
#   a planning body. A body name must now carry a whole-word planning term AND a
#   body noun, so a surname cannot satisfy it.
#
#   FIVE URLS WERE INVENTED AND THEIR 404s RECORDED AS FINDINGS. Anaheim L2 NONE
#   and L4 NONE, NYC L9 NONE, and BLOCKED on two L8 hosts that do not exist. The
#   Anaheim Granicus probe used view_id=10; the adapter uses view_id=2. Every URL
#   below is now annotated with where it comes from, and a layer with no
#   sourceable URL prints NEEDS-NAVIGATION saying so.
#
#   A 39-BYTE PAGE WAS CALLED DOC. The classifier only rejected thin pages when
#   scripts were present, so a near-empty page with no scripts fell through to
#   DOC. A page carrying almost no text is not a document whatever else is true
#   of it.
#
# Output is written to a file and printed once, between markers, so that reading
# the run log cannot pick up the script's own echo lines as results. The first
# read of this workflow did exactly that and produced 17 cells for a market
# called "$market".
#
# Captures nothing, writes nothing, safe to dispatch and safe to delete.
name: Scorecard probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner egress
        run: |
          echo "=== runner egress (a BLOCKED below is only valid from here) ==="
          curl -s --max-time 20 https://ipinfo.io/json || echo "ipinfo unreachable"
          : > /tmp/cells.txt

      - name: Write the shared helpers
        run: |
          cat > /tmp/lib.sh <<'SH'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36'

          cell () { printf 'CELL|%s|%s|%s|%s\n' "$1" "$2" "$3" "$4" >> /tmp/cells.txt; }

          # A LAYER WITH NO SOURCEABLE URL. Rule 3: this is the only honest answer
          # when nothing in an adapter, the pilot, or a named statewide register
          # points at the thing. It is not NONE - NONE means checked and not
          # published, and nothing has been checked.
          nav () { cell "$1" "$2" NEEDS-NAVIGATION "$3"; }

          # classify <market> <layer> <url> <provenance>
          #
          # Separates the outcomes that all LOOK like failure, and refuses to call
          # a near-empty page a document:
          #   no TCP                       -> BLOCKED, NETWORK
          #   TCP, no completion           -> BLOCKED, APP-SHAPE
          #   200 + challenge interstitial -> BLOCKED, NETWORK
          #   404/410                      -> NONE, checked and not published here
          #   200 + thin + scripts         -> BLOCKED, APP-SHAPE
          #   200 + thin + no scripts      -> NEEDS-NAVIGATION, answered but empty
          #   200 + real text              -> DOC
          classify () {
            market="$1"; layer="$2"; url="$3"; prov="${4:-}"
            host=$(printf '%s' "$url" | sed -E 's#https?://##; s#/.*##')
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$host/443" 2>/dev/null; then tcp=OPEN; else tcp=DROPPED; fi
            code=$(curl -sL -o /tmp/c.out -w '%{http_code}' --max-time 60 -A "$UA" "$url")
            bytes=$(wc -c < /tmp/c.out | tr -d ' ')
            script=$(grep -oic '<script' /tmp/c.out 2>/dev/null || echo 0)
            text=$(sed 's/<[^>]*>//g' /tmp/c.out 2>/dev/null | tr -s ' \n' ' ' | wc -c | tr -d ' ')
            echo "  probe $market L$layer $host tcp=$tcp http=$code bytes=$bytes scripts=$script text=$text"
            if [ "$tcp" = "DROPPED" ]; then
              cell "$market" "$layer" BLOCKED "NETWORK: no TCP to $host:443 from the runner. $prov"
            elif [ "$code" = "000" ]; then
              cell "$market" "$layer" BLOCKED "APP-SHAPE: $host accepts TCP but the request never completes; client-side app, no server route. $prov"
            elif grep -qi 'Attention Required\|Just a moment\|have been blocked\|cf-browser-verification' /tmp/c.out 2>/dev/null; then
              cell "$market" "$layer" BLOCKED "NETWORK: $host served an interactive challenge page ($code, ${bytes}b). $prov"
            elif [ "$code" = "404" ] || [ "$code" = "410" ]; then
              cell "$market" "$layer" NONE "$host answered $code at an address this repo already uses: checked, not published here. $prov"
            elif [ "$code" = "200" ] && [ "$text" -lt 1200 ] && [ "$script" -gt 0 ]; then
              cell "$market" "$layer" BLOCKED "APP-SHAPE: $host returns 200 with only ${text}b of visible text behind $script scripts; client-side app, no server route. $prov"
            elif [ "$code" = "200" ] && [ "$text" -lt 1200 ]; then
              cell "$market" "$layer" NEEDS-NAVIGATION "$host answers 200 but carries only ${text}b of visible text and no scripts; that is not a document, read the navigation. $prov"
            elif [ "$code" = "200" ]; then
              cell "$market" "$layer" DOC "$host answers 200 with ${text}b of readable text. $prov"
            else
              cell "$market" "$layer" NEEDS-NAVIGATION "$host answered $code with ${text}b; not a clean yes or no. $prov"
            fi
          }
          SH
          echo "helpers written"

      - name: Legistar markets, layers 1 2 3 4 6 7
        run: |
          set +e
          . /tmp/lib.sh
          JUA='philipkwong-agents/1.0 (+scorecard-probe)'
          # webapi.legistar.com is sources/legistar.ts. The five Legistar markets
          # in the scored nine; Westchester and Yonkers are DEFERRED rows and are
          # deliberately not probed.
          for pair in \
            "clark:Clark County" \
            "broward:Broward County" \
            "phoenix:Phoenix" \
            "nashville:Nashville" \
            "oakland:Oakland"; do
            client="${pair%%:*}"; market="${pair#*:}"
            echo "--------------------------------------------------------"
            echo "LEGISTAR $client  ($market)"

            bodies=$(curl -s --max-time 40 -A "$JUA" -H 'Accept: application/json' \
              "https://webapi.legistar.com/v1/$client/Bodies?\$top=250")
            nbodies=$(printf '%s' "$bodies" | grep -o '"BodyId"' | wc -l | tr -d ' ')
            echo "  bodies returned: $nbodies"

            events=$(curl -s --max-time 40 -A "$JUA" -H 'Accept: application/json' \
              "https://webapi.legistar.com/v1/$client/Events?\$top=3")
            nev=$(printf '%s' "$events" | grep -o '"EventId"' | wc -l | tr -d ' ')
            if [ "$nev" -gt 0 ]; then
              cell "$market" 1 FIELD "Legistar Events returns $nev events as queryable JSON (sources/legistar.ts)"
            else
              cell "$market" 1 BLOCKED "NETWORK: Legistar Events returned no EventId from the runner"
            fi

            # L2 THE BODY MUST BE A BODY. A whole-word planning term AND a body
            # noun, so "Rebecca Kaplan" cannot satisfy it - which it did on the
            # first run, through a bare (plan|zon) substring.
            names=$(printf '%s' "$bodies" | grep -oE '"BodyName":"[^"]*"' | sed 's/"BodyName":"//;s/"$//')
            plan=$(printf '%s\n' "$names" \
              | grep -iE '(^|[^a-z])(planning|zoning|land[ -]use)([^a-z]|$)' \
              | grep -iE '(commission|committee|subcommittee|board|council|authority|panel|hearing)' \
              | head -1)
            if [ -n "$plan" ]; then
              cell "$market" 2 FIELD "Legistar body: $plan"
            else
              nav "$market" 2 "no body in Legistar carries a whole-word planning or zoning term together with a body noun; it may publish separately, as Broward's Planning Council does"
            fi

            note=$(printf '%s\n' "$names" | grep -iE 'notice' | head -1)
            if [ -n "$note" ]; then
              cell "$market" 6 FIELD "Legistar body: $note"
            else
              nav "$market" 6 "no notices body in Legistar"
            fi

            # THE ENCODED MATTERS QUERY. The space in "MatterId desc" must be
            # %20; unencoded it returns HTTP 000 and every layer below it reads
            # as absent.
            matters=$(curl -s --max-time 60 -A "$JUA" -H 'Accept: application/json' \
              "https://webapi.legistar.com/v1/$client/Matters?\$orderby=MatterId%20desc&\$top=60")
            nmat=$(printf '%s' "$matters" | grep -o '"MatterId"' | wc -l | tr -d ' ')
            echo "  matters returned: $nmat"

            if [ "$nmat" -eq 0 ]; then
              nav "$market" 3 "the Matters query returned nothing from the runner; layers 3, 4 and 7 are unanswered rather than absent"
              nav "$market" 4 "the Matters query returned nothing from the runner"
              nav "$market" 7 "the Matters query returned nothing from the runner"
              continue
            fi

            # L3 staff report: does the publisher attach anything to a matter at
            # all. Whether the attachment carries CONDITIONS is a different
            # question and market-standard.ts already answers it.
            mid=$(printf '%s' "$matters" | grep -oE '"MatterId":[0-9]+' | head -1 | cut -d: -f2)
            att=$(curl -s --max-time 40 -A "$JUA" -H 'Accept: application/json' \
              "https://webapi.legistar.com/v1/$client/Matters/$mid/Attachments")
            natt=$(printf '%s' "$att" | grep -o '"MatterAttachmentId"' | wc -l | tr -d ' ')
            anames=$(printf '%s' "$att" | grep -oE '"MatterAttachmentName":"[^"]*"' | head -2 | sed 's/"MatterAttachmentName":"//;s/"$//' | tr '\n' ';')
            if [ "$natt" -gt 0 ]; then
              cell "$market" 3 DOC "matter $mid carries $natt attachments, e.g. $anames"
            else
              nav "$market" 3 "the newest matter ($mid) carries no attachment; sample more, or the staff report is on a separate portal"
            fi

            # L4 and L7. WHICH FIELD carries the case number decides FIELD against
            # DOC: a field can be filtered server-side, a title has to be fetched
            # and parsed. The pilot got this wrong by reading MatterFile alone.
            files=$(printf '%s' "$matters" | grep -oE '"MatterFile":"[^"]*"' | sed 's/"MatterFile":"//;s/"$//')
            titles=$(printf '%s' "$matters" | grep -oE '"MatterTitle":"[^"]{0,80}' | sed 's/"MatterTitle":"//')
            CASE='^[A-Z]{2,4}-?[0-9]{2}-?[0-9]{3,}'
            nf=$(printf '%s\n' "$files" | grep -cE "$CASE")
            nt=$(printf '%s\n' "$titles" | grep -cE "$CASE")
            echo "  case-numbered: MatterFile $nf/$nmat, MatterTitle $nt/$nmat"
            if [ "$nf" -gt 0 ]; then
              cell "$market" 4 FIELD "$nf of $nmat carry a case-numbered MatterFile, e.g. $(printf '%s\n' "$files" | grep -E "$CASE" | head -1)"
            elif [ "$nt" -gt 0 ]; then
              cell "$market" 4 DOC "$nt of $nmat carry the case number in MatterTitle and not in a queryable field, e.g. $(printf '%s\n' "$titles" | grep -E "$CASE" | head -1 | cut -c1-52)"
            else
              nav "$market" 4 "no case number in MatterFile or MatterTitle across $nmat matters; the register may be a separate portal"
            fi

            types=$(printf '%s' "$matters" | grep -oE '"MatterTypeName":"[^"]*"' | sed 's/"MatterTypeName":"//;s/"$//' | sort -u)
            ninstr=$(printf '%s\n' "$types" | grep -ciE 'ordinance|resolution|agreement|contract')
            nti=$(printf '%s\n' "$titles" | grep -ciE 'ordinance|resolution|agreement')
            if [ "$ninstr" -gt 0 ]; then
              cell "$market" 7 FIELD "$ninstr instrument matter types: $(printf '%s\n' "$types" | grep -iE 'ordinance|resolution|agreement|contract' | tr '\n' ';' | cut -c1-90)"
            elif [ "$nti" -gt 0 ]; then
              cell "$market" 7 DOC "no instrument matter TYPE, but $nti of $nmat titles name an ordinance, resolution or agreement; it is in text, not in a field"
            else
              nav "$market" 7 "no instrument in the matter types or titles of $nmat matters"
            fi
          done

      - name: Las Vegas, layers 1 2 3 4
        run: |
          set +e
          . /tmp/lib.sh
          # sources/lasvegas.ts
          out=$(curl -s --max-time 60 -A "$UA" \
            "https://lasvegas.primegov.com/api/v2/PublicPortal/ListArchivedMeetings?year=2026")
          bytes=$(printf '%s' "$out" | wc -c | tr -d ' ')
          echo "  PrimeGov bytes: $bytes"
          if printf '%s' "$out" | grep -q 'Attention Required\|have been blocked\|Just a moment'; then
            cell "Las Vegas" 1 BLOCKED "NETWORK: Cloudflare WAF block page even from the runner"
            cell "Las Vegas" 2 BLOCKED "NETWORK: same host, same block"
            cell "Las Vegas" 3 BLOCKED "NETWORK: same host, same block"
          else
            titles=$(printf '%s' "$out" | grep -oE '"title":"[^"]*"' | sed 's/"title":"//;s/"$//' | sort -u)
            ncouncil=$(printf '%s\n' "$titles" | grep -ciE 'city council')
            nplan=$(printf '%s\n' "$titles" | grep -ciE 'planning commission')
            ndoc=$(printf '%s' "$out" | grep -o '"templateName"' | wc -l | tr -d ' ')
            cell "Las Vegas" 1 FIELD "PrimeGov JSON ${bytes}b, $ncouncil City Council meeting titles (sources/lasvegas.ts)"
            if [ "$nplan" -gt 0 ]; then
              cell "Las Vegas" 2 FIELD "PrimeGov JSON, $nplan Planning Commission meeting titles"
            else
              nav "Las Vegas" 2 "PrimeGov answers but names no Planning Commission meeting in 2026"
            fi
            if [ "$ndoc" -gt 0 ]; then
              cell "Las Vegas" 3 DOC "PrimeGov lists $ndoc meeting document templates alongside the meetings"
            else
              nav "Las Vegas" 3 "PrimeGov answers but names no meeting document"
            fi
          fi
          # sources/govdocs.ts
          classify "Las Vegas" 4 "https://www.lasvegasnevada.gov/Government/Agendas-Minutes" "govdocs.ts already reads this index"

      - name: Anaheim, layers 1 2 3
        run: |
          set +e
          . /tmp/lib.sh
          # THE view_id COMES FROM THE ADAPTER. agenda-portal.ts:345 is
          # ViewPublisher.php?view_id=2. The first run guessed view_id=10, got a
          # 404, and recorded NONE - a fact about a URL nobody uses.
          classify "Anaheim" 2 "https://anaheim.granicus.com/ViewPublisher.php?view_id=2" "agenda-portal.ts:345, the Planning Commission publisher"
          # govdocs.ts:118. The adapter's own comment records that this host times
          # out from the developer machine and answers from elsewhere, which is
          # the whole reason this workflow exists.
          classify "Anaheim" 1 "https://local.anaheim.net/docs_agend/" "govdocs.ts:118; pilot recorded 232,143b for a specific agenda, this is the index"
          classify "Anaheim" 3 "https://local.anaheim.net/docs_agend/" "same host as L1; this probes REACHABILITY only. The Anaheim reader returns 9 fact kinds and ZERO conditions by measurement, so the layer can be readable and still yield nothing"

      - name: CFTOD, layers 1 3 10
        run: |
          set +e
          . /tmp/lib.sh
          # Every URL here is one govdocs.ts already fetches.
          classify "Central Florida Tourism Oversight District" 1 \
            "https://www.oversightdistrict.org/wp-content/uploads/2026/03/3-27-2026-BOS-Agenda-Packet-FINAL.pdf" \
            "govdocs.ts; Board of Supervisors agenda packet"
          classify "Central Florida Tourism Oversight District" 3 \
            "https://www.oversightdistrict.org/wp-content/uploads/2026/02/2-27-2026-BOS-Agenda-Packet-FINAL.pdf" \
            "govdocs.ts; the packet carries the staff material"
          classify "Central Florida Tourism Oversight District" 10 \
            "https://www.oversightdistrict.org/wp-content/uploads/2026/01/2045-CFTOD-Comprehensive-Plan.pdf" \
            "govdocs.ts; CFTOD IS a special district, so layer 10 is its primary layer"

      - name: New York City, layers 1 4 5 6
        run: |
          set +e
          . /tmp/lib.sh
          # sources/nyc-ceqr.ts
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' --max-time 45 \
            "https://data.cityofnewyork.us/resource/gezn-7mgk.json?\$limit=2")
          echo "  CEQR projects dataset -> $code"
          if [ "$code" = "200" ]; then
            cell "New York City" 5 FIELD "Socrata dataset gezn-7mgk answers 200; CEQR projects queryable (sources/nyc-ceqr.ts)"
          else
            cell "New York City" 5 BLOCKED "NETWORK: Socrata gezn-7mgk returned $code from the runner"
          fi
          # sources/nyc-zap.ts
          zap=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 "https://zap.planning.nyc.gov/projects/")
          echo "  ZAP -> $zap"
          if [ "$zap" = "200" ]; then
            cell "New York City" 4 FIELD "ZAP project register answers 200 (sources/nyc-zap.ts)"
          else
            nav "New York City" 4 "ZAP returned $zap; check the Socrata equivalent"
          fi
          # sources/nyc-city-record.ts
          classify "New York City" 6 "https://a856-cityrecord.nyc.gov/" "sources/nyc-city-record.ts"
          # THE RECORDED 403 IS PROBED, NOT ASSERTED. A 403 that has lifted is
          # coverage we would go on withholding for no reason.
          nyc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 \
            -H 'Accept: application/json' "https://webapi.legistar.com/v1/nyc/Bodies?\$top=5")
          echo "  NYC Council Legistar -> $nyc"
          case "$nyc" in
            200) cell "New York City" 1 FIELD "webapi.legistar.com/v1/nyc answers 200 - THE 403 HAS LIFTED, and every NYC coverage claim in this repo needs revisiting";;
            403) cell "New York City" 1 BLOCKED "NETWORK: webapi.legistar.com/v1/nyc returns 403 from the runner, so this is the feed refusing and not our egress. Unchanged since first recorded";;
            *)   nav "New York City" 1 "NYC Legistar returned $nyc, neither the recorded 403 nor a working feed";;
          esac

      - name: California environmental, layer 5
        run: |
          set +e
          . /tmp/lib.sh
          # sources/ceqanet.ts
          for agency in "Anaheim, City of" "Oakland, City of"; do
            enc=$(printf '%s' "$agency" | sed 's/ /%20/g; s/,/%2C/g')
            code=$(curl -s -o /tmp/ceqa.csv -w '%{http_code}' --max-time 90 \
              "https://ceqanet.lci.ca.gov/Search?LeadAgency=$enc&OutputFormat=CSV")
            bytes=$(wc -c < /tmp/ceqa.csv | tr -d ' ')
            rows=$(wc -l < /tmp/ceqa.csv | tr -d ' ')
            market=$(printf '%s' "$agency" | sed 's/, City of//')
            echo "  CEQAnet $agency -> HTTP $code ${bytes}b ${rows} lines"
            if [ "$code" = "200" ] && [ "$bytes" -gt 2000 ]; then
              cell "$market" 5 FIELD "CEQAnet lead-agency CSV, ${bytes}b, ${rows} rows (sources/ceqanet.ts)"
            else
              cell "$market" 5 NONE "CEQAnet, which this repo already reads, returns no meaningful rows for this lead agency (HTTP $code, ${bytes}b)"
            fi
          done

      - name: Florida environmental, layer 5
        run: |
          set +e
          . /tmp/lib.sh
          # sources/sfwmd.ts
          code=$(curl -s -o /tmp/sf.json -w '%{http_code}' --max-time 60 \
            "https://services1.arcgis.com/sDAPyc2rGRn7vf9B/arcgis/rest/services?f=json")
          bytes=$(wc -c < /tmp/sf.json | tr -d ' ')
          echo "  SFWMD ArcGIS -> HTTP $code ${bytes}b"
          if [ "$code" = "200" ] && [ "$bytes" -gt 200 ]; then
            cell "Broward County" 5 FIELD "SFWMD ArcGIS REST answers 200 with ${bytes}b; environmental resource permitting is queryable (sources/sfwmd.ts)"
            cell "Central Florida Tourism Oversight District" 5 FIELD "the same SFWMD service; the district sits inside the water management district"
          else
            nav "Broward County" 5 "SFWMD ArcGIS returned $code with ${bytes}b"
            nav "Central Florida Tourism Oversight District" 5 "SFWMD ArcGIS returned $code with ${bytes}b"
          fi

      - name: Layer 5 where there is no statute to publish under
        run: |
          . /tmp/lib.sh
          # NOT A PROBE, AND IT MUST NOT BE ONE. Nevada, Arizona and Tennessee
          # have no CEQA-equivalent statute for local discretionary approvals, so
          # there is no project environmental determination to publish and no URL
          # whose absence would prove it. NONE here is a fact about the law.
          cell "Clark County" 5 NONE "Nevada has no CEQA-equivalent statute. What Clark publishes under environment is AIR QUALITY permitting - stationary source and dust control - which is a pollution permit, not a project determination"
          cell "Las Vegas" 5 NONE "Nevada, as above"
          cell "Phoenix" 5 NONE "Arizona has no CEQA-equivalent statute for local discretionary approvals"
          cell "Nashville" 5 NONE "Tennessee has no CEQA-equivalent statute for local discretionary approvals"

      - name: Layer 8, and WHICH KIND of blocked
        run: |
          set +e
          . /tmp/lib.sh
          # ONLY THE TWO HOSTS THE PILOT ACTUALLY PROBED. The first run invented
          # permit-portal hostnames for Las Vegas, Phoenix, Nashville, Oakland,
          # Broward and New York and recorded BLOCKED and DOC against them.
          classify "Anaheim"      8 "https://permits.anaheim.net/"                           "the pilot probed this host and recorded APP-SHAPE blocked"
          classify "Clark County" 8 "https://citizenaccess.clarkcountynv.gov/CitizenAccess/"  "Accela CitizenAccess; the pilot probed this host"
          for m in "Las Vegas" "Phoenix" "Nashville" "Oakland" "Broward County" "New York City" "Central Florida Tourism Oversight District"; do
            nav "$m" 8 "no permit portal for this market is named in any adapter or in the pilot, and this repo holds one building-permit reference in total; the jurisdiction's own navigation has to be read"
          done

      - name: Layer 9 licences
        run: |
          set +e
          . /tmp/lib.sh
          # California ABC is a NAMED STATEWIDE REGISTER and the pilot probed it.
          # broward.org/RecordsTaxesTreasury is the pilot's Broward 9 evidence.
          classify "Anaheim"        9 "https://www.abc.ca.gov/licensing/license-lookup/" "California ABC, statewide; the pilot probed it. Covers Oakland too"
          classify "Oakland"        9 "https://www.abc.ca.gov/licensing/license-lookup/" "the same statewide register as Anaheim"
          classify "Broward County" 9 "https://www.broward.org/RecordsTaxesTreasury/Pages/LocalBusinessTax.aspx" "the pilot's Broward 9 evidence, Local Business Tax register"
          for m in "Clark County" "Las Vegas" "Phoenix" "Nashville" "New York City" "Central Florida Tourism Oversight District"; do
            nav "$m" 9 "no licence register for this market is named in any adapter or in the pilot; 'business licen' appears zero times across agents/ and lib/"
          done

      - name: Layer 10 special district and authority
        run: |
          set +e
          . /tmp/lib.sh
          classify "Clark County"   10 "https://www.clarkcountynv.gov/government/departments/administrative_services/town___liaison_services/paradise-tab" "clark-tab.ts reads the Town Advisory Boards"
          classify "Broward County" 10 "https://www.broward.org/PlanningCouncil/" "the pilot's Broward 2 evidence: the Planning Council is NOT in Broward's Legistar"
          for m in "Anaheim" "Las Vegas" "Phoenix" "Nashville" "New York City" "Oakland"; do
            nav "$m" 10 "no special district or authority for this market is named in any adapter or in the pilot"
          done

      - name: Layers with no probe at all
        run: |
          . /tmp/lib.sh
          # NOTHING IS SILENTLY ABSENT. Every (market, layer) the steps above do
          # not reach gets a row saying why, so a blank in the grid can only ever
          # mean nobody asked - and after this run, nobody has to wonder which.
          for m in "Anaheim" "Las Vegas" "Central Florida Tourism Oversight District"; do
            nav "$m" 6 "no legal-notice publication for this market is named in any adapter or in the pilot"
          done
          nav "Anaheim" 4 "no land-use case register for Anaheim is named in any adapter; the first run guessed a city URL, got 404 and recorded NONE"
          nav "Anaheim" 7 "no ordinance or agreement source for Anaheim is named in any adapter"
          nav "Las Vegas" 6 "as above"
